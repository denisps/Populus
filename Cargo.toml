[workspace]
resolver = "3"
members = [
    "crates/*",
    "sim/populus-sim",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/denisps/Populus"

[workspace.dependencies]
futures = "0.3"
libp2p = { version = "0.57.1", default-features = false, features = [
    "dns",
    "identify",
    "macros",
    "noise",
    "ping",
    "quic",
    "request-response",
    "tcp",
    "tokio",
    "yamux",
] }
sha2 = { version = "0.10.9", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unused_qualifications = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
needless_pass_by_value = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
